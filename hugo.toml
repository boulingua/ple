# ─────────────────────────────────────────────────────────────────────────
# ple — Português Língua Estrangeira. Instantiated from `pagegen`, the
# canonical boulingua language-course template (Hugo + hugo-coder).
#
# Course-specific values are set below; everything else is the shared
# standard and should NOT be edited per course. The teaching norm is
# European Portuguese (pt-PT) under the 1990 Acordo Ortográfico — see
# ROADMAP.md §2. That decision is expensive to reverse: change
# `languageCode`/`defaultContentLanguage` only together with the style
# guide and the whole content tree.
# ─────────────────────────────────────────────────────────────────────────

baseURL = "https://boulingua.github.io/ple/"
title = "Português (PLE) — S. Le Boulanger"
languageCode = "pt-PT"
defaultContentLanguage = "pt-PT"
enableEmoji = false
enableRobotsTXT = true

[pagination]
  pagerSize = 20

[markup.highlight]
  noClasses = false

[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
  ordered = false

# Tags are DECLARED, not implicit — derive them from structured fields.
[taxonomies]
  tag = "tags"
  skill = "skills"
  level = "levels"
  topic = "topics"

[params]
  navTitle = "Português"
  author = "S. Le Boulanger"
  description = "A European Portuguese course along the Common European Framework — a Pre-A1 sound-and-spelling stage plus A1, A2 and B1, each unit with a model exam, slide deck, worksheet and native-voice audio."
  keywords = "Portuguese,Português,PLE,European Portuguese,pt-PT,CEFR,A1,A2,B1,curriculum,OER,Gesamtschule,Lusophone"
  dateFormat = "2006-01-02"
  since = 2025
  colorScheme = "auto"
  hideCredits = true
  # The colour-scheme toggle is a labelled control in the navbar
  # (layouts/_partials/header.html); disable the theme's floating duplicate
  # so there is exactly one toggle on the page.
  hideColorSchemeToggle = true
  customCSS = ["css/custom.css"]
  # Site code — selects this course's accent from data/accents.yaml
  # (#B723C7 light / #DC7EE7 dark). Drives the accent; never edit CSS.
  code = "ple"
  # Content licence, surfaced by pdf attribution + legal pages.
  license = "CC BY 4.0"

  # IMPORTANT — every sub-table under [params] MUST come AFTER all bare
  # [params] keys. TOML scopes everything after a header to that header, so
  # opening [params.plausible] before the keys above would silently move them
  # under params.plausible and leave the site unstyled. Keep this block LAST.
  [params.plausible]
    # Privacy-friendly, cookieless analytics on the author's self-hosted
    # instance (server in Germany), as on the sister sites. Disclosed in
    # /datenschutz/ §4. Leave `domain` empty to disable.
    domain = "boulingua.github.io/ple"
    src = "https://analytics.hellebo.de/js/script.js"

[[params.social]]
  name = "GitHub"
  icon = "fa-brands fa-github fa-2x"
  weight = 1
  url = "https://github.com/boulingua/ple"

